<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Grade Calculator</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><p class="eyebrow">ACADEMIC TOOL</p><h1>Student Grade Calculator</h1><p class="muted">Hitung nilai akhir mahasiswa dengan bobot yang sederhana.</p><form id="form"><label>Nama<input id="name" placeholder="Nama mahasiswa"></label><div class="grid"><label>Tugas <input id="tugas" type="number" min="0" max="100" value="85"></label><label>UTS <input id="uts" type="number" min="0" max="100" value="80"></label><label>UAS <input id="uas" type="number" min="0" max="100" value="90"></label><label>Kehadiran <input id="hadir" type="number" min="0" max="100" value="95"></label></div><button>Hitung Nilai</button></form><section id="result" class="result hidden"><span id="student">Mahasiswa</span><strong id="score">0</strong><div><b id="grade">-</b><span id="status">-</span></div><small>Bobot: Tugas 20% • UTS 25% • UAS 40% • Kehadiran 15%</small></section></main><script src="script.js"></script></body></html>
